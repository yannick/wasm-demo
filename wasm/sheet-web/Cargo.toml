# The GridCraft spreadsheet for the agent-demo page, as WebAssembly. Its own workspace: it builds
# only for wasm32-unknown-unknown (`just sheet-build`), with gridcraft's lockfile versions.
# gridcraft is a GridCraft checkout next to this repo (path set in the dependencies below).
[package]
name = "sheet-web"
description = "GridCraft framed by the agent-demo page, driven over postMessage"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "sheet-web"
path = "src/main.rs"

[dependencies]
gridcraft-engine = { path = "../../../../rust/gridcraft/crates/engine" }
gridcraft-ui-egui = { path = "../../../../rust/gridcraft/crates/ui-egui" }
egui = "0.36"
log = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = "0.17"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlIFrameElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Clipboard", "ClipboardItem", "Navigator", "MessageEvent", "UrlSearchParams"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
